<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg"
     font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- page -->
  <rect x="40" y="48" width="300" height="336" rx="4" fill="#ffffff" stroke="#94a3b8"/>

  <!-- tile tints: top 4 rows = covered content (green), bottom 2 rows = dropped (red) -->
  <g opacity="0.10">
    <rect x="40" y="48"  width="300" height="224" fill="#2e7d32"/>
  </g>
  <g opacity="0.16">
    <rect x="40" y="272" width="300" height="112" fill="#c62828"/>
  </g>

  <!-- text lines (present) -->
  <g stroke="#374151" stroke-width="5" stroke-dasharray="22 7" stroke-linecap="round">
    <line x1="56" y1="74"  x2="324" y2="74"/>
    <line x1="56" y1="100" x2="316" y2="100"/>
    <line x1="56" y1="126" x2="324" y2="126"/>
    <line x1="56" y1="152" x2="300" y2="152"/>
    <line x1="56" y1="178" x2="324" y2="178"/>
    <line x1="56" y1="204" x2="312" y2="204"/>
    <line x1="56" y1="230" x2="288" y2="230"/>
    <line x1="56" y1="256" x2="320" y2="256"/>
  </g>

  <!-- text lines that exist in the SOURCE but were DROPPED by the binary (dashed outline) -->
  <g stroke="#c62828" stroke-width="5" stroke-dasharray="22 7" stroke-linecap="round" opacity="0.40">
    <line x1="56" y1="296" x2="320" y2="296"/>
    <line x1="56" y1="322" x2="300" y2="322"/>
    <line x1="56" y1="348" x2="324" y2="348"/>
  </g>

  <!-- tile grid 5x6 -->
  <g stroke="#64748b" stroke-width="0.8" opacity="0.55">
    <line x1="100" y1="48" x2="100" y2="384"/>
    <line x1="160" y1="48" x2="160" y2="384"/>
    <line x1="220" y1="48" x2="220" y2="384"/>
    <line x1="280" y1="48" x2="280" y2="384"/>
    <line x1="40" y1="104" x2="340" y2="104"/>
    <line x1="40" y1="160" x2="340" y2="160"/>
    <line x1="40" y1="216" x2="340" y2="216"/>
    <line x1="40" y1="272" x2="340" y2="272"/>
    <line x1="40" y1="328" x2="340" y2="328"/>
  </g>

  <text x="190" y="402" text-anchor="middle" font-size="11.5" fill="#64748b">page tiled at 64 px · deleted band shown in red</text>

  <!-- legend + stats -->
  <g font-size="12.5" fill="#334155">
    <rect x="392" y="60" width="20" height="14" rx="2" fill="#2e7d32" opacity="0.35"/>
    <text x="420" y="72">content tile — covered (recall ≈ 1)</text>

    <rect x="392" y="92" width="20" height="14" rx="2" fill="#c62828" opacity="0.45"/>
    <text x="420" y="104">content tile — dropped (recall ≈ 0)</text>

    <rect x="392" y="124" width="20" height="14" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="420" y="136">skipped — no source content</text>
  </g>

  <line x1="392" y1="166" x2="724" y2="166" stroke="#e2e8f0" stroke-width="1"/>

  <g font-size="13">
    <text x="392" y="196" fill="#2e7d32" font-weight="600">page-average recall &#8776; 0.7</text>
    <text x="392" y="214" fill="#64748b" font-size="11.5">global mean &#8594; the band is hidden</text>

    <text x="392" y="250" fill="#c62828" font-weight="600">worst-20% region &#8776; 0.0</text>
    <text x="392" y="268" fill="#64748b" font-size="11.5">spatial &#8594; the band is caught</text>

    <rect x="392" y="288" width="332" height="44" rx="8" fill="#eef4fb" stroke="#0B6BCB"/>
    <text x="408" y="308" fill="#0B6BCB" font-weight="600" font-size="13">q_cov = ramp(worst-region) &#8594; 0</text>
    <text x="408" y="325" fill="#334155" font-size="11.5">closes the gate &#8594; ZQS pulled to ~0</text>
  </g>
</svg>
