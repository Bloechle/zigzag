<svg viewBox="0 0 880 330" xmlns="http://www.w3.org/2000/svg"
     font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- quality measures -->
  <rect x="22" y="66" width="166" height="58" rx="9" fill="#eef4fb" stroke="#0B6BCB"/>
  <text x="105" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6BCB">q_clean</text>
  <text x="105" y="110" text-anchor="middle" font-size="11.5" fill="#334155">background clean</text>

  <rect x="22" y="176" width="166" height="58" rx="9" fill="#eef4fb" stroke="#0B6BCB"/>
  <text x="105" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6BCB">f_adh</text>
  <text x="105" y="220" text-anchor="middle" font-size="11.5" fill="#334155">contours on source edges</text>

  <!-- sqrt merge node -->
  <line x1="188" y1="95"  x2="258" y2="142" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="188" y1="205" x2="258" y2="158" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
  <circle cx="290" cy="150" r="32" fill="#fff" stroke="#1f2937" stroke-width="1.6"/>
  <text x="290" y="156" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">&#8730;</text>

  <!-- validity gates -->
  <rect x="392" y="26" width="156" height="54" rx="9" fill="#f5f7fa" stroke="#475569"/>
  <text x="470" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">q_cov</text>
  <text x="470" y="67" text-anchor="middle" font-size="11.5" fill="#334155">covered everywhere</text>

  <rect x="586" y="26" width="156" height="54" rx="9" fill="#f5f7fa" stroke="#475569"/>
  <text x="664" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">q_solid</text>
  <text x="664" y="67" text-anchor="middle" font-size="11.5" fill="#334155">no solid flood</text>

  <!-- multiply nodes -->
  <line x1="322" y1="150" x2="448" y2="150" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
  <circle cx="470" cy="150" r="22" fill="#fff" stroke="#1f2937" stroke-width="1.6"/>
  <text x="470" y="156" text-anchor="middle" font-size="18" fill="#1f2937">&#215;</text>
  <line x1="470" y1="80" x2="470" y2="126" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>

  <line x1="492" y1="150" x2="642" y2="150" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
  <circle cx="664" cy="150" r="22" fill="#fff" stroke="#1f2937" stroke-width="1.6"/>
  <text x="664" y="156" text-anchor="middle" font-size="18" fill="#1f2937">&#215;</text>
  <line x1="664" y1="80" x2="664" y2="126" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- output -->
  <line x1="686" y1="150" x2="744" y2="150" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="752" y="122" width="104" height="56" rx="9" fill="#0B6BCB"/>
  <text x="804" y="156" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">ZQS</text>

  <!-- braces / captions -->
  <text x="290" y="250" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">QUALITY CORE — averaged (√)</text>
  <text x="290" y="268" text-anchor="middle" font-size="11" fill="#64748b">one weak factor sinks it</text>

  <text x="567" y="250" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">VALIDITY GATES — multiplied (veto)</text>
  <text x="567" y="268" text-anchor="middle" font-size="11" fill="#64748b">&#8776;1 when sound (inert) &#183; &#8594;0 on degeneracy</text>

  <text x="440" y="305" text-anchor="middle" font-size="12.5" fill="#334155">ZQS = 100 &#183; &#8730;(q_clean &#183; f_adh) &#183; q_cov &#183; q_solid</text>
</svg>
